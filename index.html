<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minhas Compras</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="page-title">Cadastro</h1>
    </header>

    <main id="app-content">
        <section id="cadastro" class="screen active">
            <div class="card">
                <input type="text" id="nome-produto" placeholder="Nome do produto">
                <button onclick="salvarProduto(this)">+ Salvar Produto</button>
            </div>
            <div class="card">
                <input type="text" id="nome-mercado" placeholder="Nome do mercado">
                <button onclick="salvarMercado(this)">+ Salvar Mercado</button>
            </div>
        </section>

        <section id="promocao" class="screen">
            <div class="card">
                <select id="promo-mercado"><option value="">Selecione o Mercado...</option></select>
                <select id="promo-produto"><option value="">Selecione o Produto...</option></select>
                <input type="number" id="promo-valor" inputmode="decimal" placeholder="Valor na promoção (R$)">
                
                <label for="foto-encarte" style="display: block; text-align: center; background: var(--secondary); color: var(--primary); padding: 10px; border-radius: 6px; margin-bottom: 12px; cursor: pointer; font-weight: bold;">
                    📷 Ler Encarte com IA
                </label>
                <input type="file" id="foto-encarte" accept="image/*" style="display: none;">
                
                <button onclick="salvarPromocao(this)">Salvar Promoção</button>
            </div>
        </section>

        <section id="compras" class="screen">
            <select id="compra-mercado" class="mb-1"><option value="">Mercado da compra atual...</option></select>
            
            <div class="card">
                <select id="compra-produto"><option value="">Adicionar produto...</option></select>
                <small id="alerta-promo" class="alerta" style="display: none;">Em promo no mercado X por R$ 0,00</small>
                
                <input type="number" id="compra-valor" inputmode="decimal" placeholder="Valor pago (R$)">
                <button class="btn-secundario" onclick="adicionarItemCesta()">Add à Cesta</button>
            </div>

            <ul id="lista-cesta"></ul>
            
            <div class="total-bar">
                <h3>Total: R$ <span id="total-compra">0.00</span></h3>
                <button onclick="finalizarCompra(this)">Finalizar Compra</button>
            </div>
        </section>

        <section id="relatorio" class="screen">
            <div class="card">
                <h2>Resumo do Mês</h2>
                <ul class="lista-relatorio" id="lista-resumo">
                    </ul>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button onclick="mudarAba('cadastro', 'Cadastro', this)" class="nav-btn active">📝 Cad</button>
        <button onclick="mudarAba('promocao', 'Promoções', this)" class="nav-btn">⭐ Promo</button>
        <button onclick="mudarAba('compras', 'Comprar', this)" class="nav-btn">🛒 Carrinho</button>
        <button onclick="mudarAba('relatorio', 'Resumo Mensal', this)" class="nav-btn">📊 Resumo</button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
